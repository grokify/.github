name: TypeScript Lint (pnpm)

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version for linting'
        required: false
        type: string
        default: '22.x'
      pnpm-version:
        description: 'pnpm version to use'
        required: false
        type: string
        default: '9'
      working-directory:
        description: 'Directory containing package.json'
        required: false
        type: string
        default: '.'
      lint-script:
        description: 'npm script to run for linting'
        required: false
        type: string
        default: 'lint'
      format-check-script:
        description: 'npm script to run for format checking (empty to skip)'
        required: false
        type: string
        default: 'format:check'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linter
      run: pnpm run ${{ inputs.lint-script }}

    - name: Check formatting
      if: inputs.format-check-script != ''
      run: pnpm run ${{ inputs.format-check-script }}
